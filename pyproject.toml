[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-badcase-workflow"
version = "0.1.0.dev0"
description = "Badcase 导入、判定与审核入库服务"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
]

[tool.setuptools]
packages = ["app", "app.api", "app.application", "app.domain", "app.infrastructure", "app.workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
